name: Generate stats card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate and commit stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cria a pasta dist se não existir
          mkdir -p dist
          
          # Baixa o SVG gerado pelo github-readme-stats usando a URL oficial
          # Substitua 'seu-usuario' pelo seu nome de usuário do GitHub reais se necessário, 
          # ou deixe ${GITHUB_REPOSITORY%%/*} que pega o dono automaticamente.
          OWNER="${{ github.repository_owner }}"
          URL="https://github-readme-stats.vercel.app/api?username=${OWNER}&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=codeSTACKr&locale=pt-br&hide_border=false"
          
          echo "Baixando stats de: $URL"
          curl -s "$URL" -o dist/stats.svg
          
          # Configura o git do bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Faz o push para a branch stats-output (criando-a se não existir)
          git checkout --orphan stats-output || git checkout stats-output
          git rm -rf . || true
          mv dist/stats.svg stats.svg
          rm -rf dist
          
          git add stats.svg
          git commit -m "chore: update stats card [skip ci]" || echo "Nenhuma mudança para commitar"
          git push origin stats-output --force
